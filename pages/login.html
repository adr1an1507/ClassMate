<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Classmate</title>

</head>
</head>
<body>

    <!-- Main page wrapper -->
    <div class="page">
        <!-- Login page container -->
        <div class="login-container">
            <!-- Brand section -->
            <div class="brand-section">
                <div class="brand-content">
                    <h1 class="brand-name">ClassMate</h1>
                    <p class="brand-tagline">Manage your classes and tasks in one place.</p>
                </div>
            </div>
        </div>

        <!-- Login card -->
        <div class="login-card">
            <!-- Login header -->
            <div class="login-header">
                <div class="login-title">
                    <h2>Welcome back</h2>
                    <div class="login-description">
                        <p>Sign in to access your ClassMate account.</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Login form section -->
        <div class="login-form-container">
            <form action="login-form" action="#" method="post"></form>
            <!-- Username field -->
            <div class="form-group username-group">
                <div class="form-label">
                    <label for="username">Username</label>
                    <div class="form-input">
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                </div>
            </div>
        </div>

        <!-- Password Field -->
        <div class="form-group password-group">
            <div class="form-label">
                <label for="password">Password</label>
                <div class="form-input">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>
        </div>

        <!-- Form options -->
        <div class="form-option">
            <!-- Remember me check box -->
            <div class="remember-section">
                <div class="remember-checkbox">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <div class="remember-label">
                        <label for="remember-me">
                            Remember me
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-password">
            <a href="#" class="link">
                Forgot password?
            </a>
        </div>

        <!-- Submit button -->
        <div class="button-section">
            <div class="button-container">
                <button type="submit" class="btn-primary">Sign in</button>
            </div>
        </div>

        <!-- Registration section -->
        <div class="login-footer">
            <div class="registration-text">
                <p>Don't have account?</p>
                <div class="registration-link">
                    <a href="register.html">Create account</a>
                </div>
            </div>
        </div>
    </div>
</html>
