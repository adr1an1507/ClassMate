
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassMate | Create Account</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <!-- Main page wrapper -->
    <div id="page">

        <!-- Main registration content -->
        <main id="main-content">

            <section id="registration-section">

                <!-- Registration heading -->
                <header id="registration-heading">
                    <p id="registration-label">GET STARTED</p>
                    <h1 id="registration-title">Create Account</h1>

                    <p id="registration-description">
                        Create your ClassMate student account.
                    </p>
                </header>

                <!-- Registration form -->
                <form id="registration-form" action="#" method="post">

                    <!-- Personal information -->
                    <div id="personal-information">

                        <div id="first-name-group" class="form-group">
                            <label for="first-name">First Name</label>
                            <input
                                type="text"
                                id="first-name"
                                name="first-name"
                                placeholder="Enter your first name"
                                autocomplete="given-name"
                                required
                            >
                        </div>

                        <div id="last-name-group" class="form-group">
                            <label for="last-name">Last Name</label>
                            <input
                                type="text"
                                id="last-name"
                                name="last-name"
                                placeholder="Enter your last name"
                                autocomplete="family-name"
                                required
                            >
                        </div>

                    </div>

                    <!-- Age -->
                    <div id="age-group" class="form-group">
                        <label for="age">Age</label>
                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="18"
                            max="65"
                            placeholder="Enter your age"
                            required
                        >
                    </div>

                    <!-- University or school -->
                    <div id="school-group" class="form-group">
                        <label for="school">University / School</label>
                        <input
                            type="text"
                            id="school"
                            name="school"
                            placeholder="Enter your university or school"
                            autocomplete="organization"
                            required
                        >
                    </div>

                    <!-- Email address -->
                    <div id="email-group" class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                        <p id="email-description">
                            Used for account verification.
                        </p>
                    </div>

                    <!-- Username -->
                    <div id="username-group" class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Create a username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div id="password-group" class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <!-- Confirm password -->
                    <div id="confirm-password-group" class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <!-- Terms and conditions -->
                    <div id="terms-conditions-group">
                        <input
                            type="checkbox"
                            id="terms-conditions"
                            name="terms-conditions"
                            required
                        >

                        <label for="terms-conditions">
                            I agree to the
                            <a id="terms-link" href="#">
                                Terms and Conditions
                            </a>
                        </label>
                    </div>

                    <!-- Registration button -->
                    <div id="registration-actions">
                        <button id="register-button" type="submit">
                            <span>Create Account</span>
                            <span id="button-arrow" aria-hidden="true">→</span>
                        </button>
                    </div>

                </form>

                <!-- Sign-in link -->
                <div id="login-link-section">
                    <p>
                        Already have an account?
                        <a id="login-link" href="login.html">Sign In</a>
                    </p>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
